apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: discovery-server }
  template:
    metadata:
      labels: { app: discovery-server }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8761"
    spec:
      containers:
        - name: discovery-server
          image: payflow/discovery-server:latest
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef: { name: payflow-config }
            - secretRef: { name: payflow-secrets }
          env:
            - name: PORT
              value: "8761"
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: payflow
spec:
  selector: { app: discovery-server }
  ports:
    - port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
