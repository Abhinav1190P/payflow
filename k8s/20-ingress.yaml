apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payflow
  namespace: payflow
spec:
  rules:
    - host: payflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
