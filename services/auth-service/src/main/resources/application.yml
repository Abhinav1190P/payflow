spring:
  application:
    name: auth-service
  config:
    import: "classpath:payflow-defaults.yml,optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55433/auth}
    username: ${DB_USER:payflow}
    password: ${DB_PASSWORD:payflow}

server:
  port: ${PORT:8081}

payflow:
  security:
    public-paths:
      - POST /api/v1/auth/register
      - POST /api/v1/auth/login
  rate-limit:
    login-max-requests: 10
    login-window: 1m
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@payflow.dev}
    admin-password: ${ADMIN_PASSWORD:Admin12345!}
