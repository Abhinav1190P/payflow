spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  kafka:
    listener:
      auto-startup: false

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false

spring.kafka.admin.auto-create: false

payflow:
  outbox:
    relay-enabled: false
  rate-limit:
    login-max-requests: 1000
