spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
            allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
            allowed-headers: "*"
            exposed-headers: [X-Correlation-Id, Idempotent-Replayed, ETag]
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_PER_SEC:50}
            redis-rate-limiter.burstCapacity: ${GATEWAY_BURST:100}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: payment
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/wallets/**,/api/v1/transfers/**,/api/v1/payments/**,/api/v1/admin/wallets/**,/api/v1/admin/fraud-alerts/**,/api/v1/admin/fraud/**,/api/v1/admin/stats
        - id: inventory
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/products,/api/v1/admin/products/**
        - id: orders
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/orders,/api/v1/admin/orders/**,/api/v1/admin/orders,/admin-ui/**
        - id: notifications
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: api-gateway
