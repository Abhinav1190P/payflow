x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    SPRING_PROFILES_ACTIVE: docker
    DB_USER: payflow
    DB_PASSWORD: payflow
    KAFKA_BOOTSTRAP: kafka:9092
    EUREKA_URL: http://discovery-server:8761/eureka
    CONFIG_SERVER_URL: http://config-server:8888
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    REDIS_HOST: redis
    PAYFLOW_JWT_SECRET: ${PAYFLOW_JWT_SECRET:-docker-dev-secret-change-me-docker-dev-secret}
  depends_on: &java-deps
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    config-server:
      condition: service_healthy
    discovery-server:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow
      POSTGRES_DB: payflow
    ports: ["55433:5432"]
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payflow"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  zipkin:
    image: openzipkin/zipkin:3
    ports: ["9411:9411"]

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

  discovery-server:
    build: { context: ., args: { MODULE: infra/discovery-server } }
    ports: ["8761:8761"]
    healthcheck: &tcp-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/$${PORT:-8761}'"]
      interval: 5s
      retries: 30

  config-server:
    build: { context: ., args: { MODULE: infra/config-server } }
    ports: ["8888:8888"]
    environment:
      PORT: 8888
    healthcheck: *tcp-health

  api-gateway:
    build: { context: ., args: { MODULE: infra/api-gateway } }
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_URL: http://discovery-server:8761/eureka
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
      REDIS_HOST: redis
      GATEWAY_RATE_PER_SEC: ${GATEWAY_RATE_PER_SEC:-50}
      GATEWAY_BURST: ${GATEWAY_BURST:-100}
    depends_on:
      discovery-server:
        condition: service_healthy

  auth-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/auth-service } }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/auth
      SPRING_PROFILES_ACTIVE: ${AUTH_PROFILES:-docker}

  payment-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/payment-service } }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/payment

  inventory-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/inventory-service } }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/inventory

  order-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/order-service } }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/orders

  notification-service:
    <<: *java-service
    build: { context: ., args: { MODULE: services/notification-service } }
    environment:
      <<: *java-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications

volumes:
  pgdata:
