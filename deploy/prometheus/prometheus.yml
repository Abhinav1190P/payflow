global:
  scrape_interval: 10s

scrape_configs:
  - job_name: payflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8081
          - payment-service:8082
          - inventory-service:8083
          - order-service:8084
          - notification-service:8085
